/* Kernidee: Jeder ALW ist ein Muster→Ersetzung-Baustein (sub → rep), der an einer
   bestimmten Stelle der Kette andockt. MEHRERE ALW pro Fahrt sind möglich, solange
   sie verschiedene Stellen der Kette ersetzen (keine Überlappung). Überlappende
   ALW bleiben wählbar, werden aber mit Warnung markiert (Jürgen, 01.11.2026).
   Retour = gleiche Regeln an der gespiegelten Kette (sub/rep rückwärts). */

function findRun(chain, run) {
  if (!run.length) return -1;
  outer: for (var i = 0; i + run.length <= chain.length; i++) {
    for (var j = 0; j < run.length; j++) if (chain[i + j] !== run[j]) continue outer;
    return i;
  }
  return -1;
}

function rev(a) { return a.slice().reverse(); }

function routeById(id) {
  for (var i = 0; i < ROUTES.length; i++) if (ROUTES[i].id === id) return ROUTES[i];
  return null;
}

function routesFor(start, ziel) {
  return ROUTES.filter(function (r) { return r.start === start && r.ziel === ziel; });
}

/* Gespiegelte Route (Retour): X -> München wird aus München -> X erzeugt. */
function mirrorRoute(route, ruckziel, appendLeg) {
  var secs = rev(route.secs);
  if (appendLeg) secs = secs.concat([appendLeg]);
  return {
    id: route.id + "_r" + (appendLeg ? "_x" : ""),
    start: route.ziel, ziel: ruckziel,
    n: route.nr || route.n, d: false, /* nr = Name in Fahrtrichtung der gespiegelten Kette (Jürgen 08.11.2026) */
    secs: secs,
    alws: route.alws.slice(),
    opts: route.opts.slice(),
    mirrored: true
  };
}

/* Retour-Routen von "von" nach "ruckziel": Spiegelung aller Hinfahrt-Routen

    ostStd.forEach(function (r) { r.d = false; });
    var firstOst = out.filter(function (r) { return ROUTES.some(function (o) { return o.id + "_r" === r.id && o.start === "muenchen_ost"; }); });
    if (firstOst.length) firstOst[0].d = true;
    else if (out.length) out[out.length - 1].d = true;
  }
  /* Fallback (07.11.2026): Fernziel-Retours ohne eigene Spiegel-Logik –
     gleiche Auflösung wie im Hinfahrt-Schritt (direkt, gespiegelt, München-Beine). */
  if (!out.length) out = routesForWithFallback(von, ruckziel);

  return out;
}

/* ALW-Anwendungsplan: Sucht die Muster aller gewählten ALW in der Basiskette.
   - Nicht überlappende ALW werden alle angewendet (Mehrfach-ALW!).
   - Überlappende ALW: nur der erste (links in der Kette) wirkt, der Rest bekommt
     eine Konflikt-Warnung (bleibt aber wählbar – Jürgens Entscheidung 01.11.2026). */
function planAlws(base, alwIds, mirrored) {
  var rules = alwIds.map(function (id) {
    var a = ALW[id];
    return {
      id: id, n: a.n, v: mirrored ? a.vr : a.v,
      sub: mirrored ? rev(a.sub) : a.sub.slice(),
      rep: mirrored ? rev(a.rep) : a.rep.slice()
    };
  });
  var found = [], noMatch = [];
  rules.forEach(function (r) {
    var idx = findRun(base, r.sub);
    if (idx >= 0) found.push({ r: r, idx: idx });
    else noMatch.push(r.id);
  });
  found.sort(function (a, b) { return a.idx - b.idx; });
  var applied = [], conflicts = [];
  var lastEnd = -1, lastId = null;
  found.forEach(function (m) {
    var end = m.idx + m.r.sub.length;
    if (m.idx < lastEnd) {
      conflicts.push({ id: m.r.id, withId: lastId });
    } else {
      applied.push(m);
      if (end > lastEnd) { lastEnd = end; lastId = m.r.id; }
    }
  });
  return { applied: applied, conflicts: conflicts, noMatch: noMatch };
}

/* Kette aus Plan bauen: Ersetzungen von rechts nach links anwenden. */
function composeChain(base, plan) {
  var chain = base.slice();
  plan.applied.slice().sort(function (a, b) { return b.idx - a.idx; }).forEach(function (m) {
    var args = [m.idx, m.r.sub.length].concat(m.r.rep);
    Array.prototype.splice.apply(chain, args);
  });
  return chain;
}

/* Optionen anwenden (kein kompletter Laufweg – Abschnitte kommen hinzu). */
function optAvailable(optId, chain) {
  var o = OPT[optId];
  if (!o) return false;
  if (o.cond) {
    var parts = o.cond.split(":");
    if (parts[0] === "chainHas" && chain.indexOf(parts[1]) === -1) return false;
  }
  return true;
}
function applyOpts(chain, optIds) {
  var out = chain.slice();
  optIds.forEach(function (id) {
    var o = OPT[id];
    if (!o || !optAvailable(id, out)) return;
    if (o.at === "end") out = out.concat(o.add);
    else if (o.at === "beforeSection") {
      var i = out.indexOf(o.ref);
      if (i >= 0) out = out.slice(0, i).concat(o.add).concat(out.slice(i));
    } else if (o.at === "afterSection") {
      var j = out.indexOf(o.ref);
      if (j >= 0) out = out.slice(0, j + 1).concat(o.add).concat(out.slice(j + 1));
    }
  });
  return out;
}

/* Komplette Fahrweg-Auswertung einer Richtung (Hin- oder Rückfahrt). */
function composeLeg(route, alwIds, optIds) {
  /* Gespiegelte Routen speichern ihre Kette bereits in Fahrtrichtung. */
  var base = route.secs;
  var mir = !!route.mirrored;
  var plan = planAlws(base, alwIds || [], mir);
  var chain = composeChain(base, plan);
  /* Konflikt-Warnung: überlappende ALW zeigen, welche nicht gewirkt haben */
  var chainAfterConflicts = chain.slice();
  var warnings = plan.conflicts.map(function (c) {
    return { typ: "konflikt", id: c.id, withId: c.withId };
  });
  plan.noMatch.forEach(function (id) {
    warnings.push({ typ: "keinTreffer", id: id });
  });
  var finalChain = applyOpts(chain, optIds || []);
  /* Delta pro gewähltem ALW (gegen die Basiskette gerechnet) */
  var deltas = {};
  (alwIds || []).forEach(function (id) {
    var single = planAlws(base, [id], mir);
    var singleChain = composeChain(base, single);
    deltas[id] = delta(base, singleChain);
  });
  return {
    base: base, chain: finalChain, plan: plan,
    warnings: warnings, deltas: deltas,
    appliedIds: plan.applied.map(function (m) { return m.r.id; }),
    alwLabels: (alwIds || []).map(function (id) {
      var a = ALW[id];

}

      if (exclSel && aid !== exclSel) { dis = true; }
      else if (exclBy(aid)) { dis = true; }
      else {
        var probe = planAlws(r.secs, alwSel.concat([aid]), mir);
        var pc = probe.conflicts.filter(function (c) { return c.id === aid; })[0];
        if (pc) { dis = true; disTxt = "Überschneidet sich mit einer gewählten ALW – nur eine der beiden wirkt"; }
        else if (probe.noMatch.indexOf(aid) >= 0) { dis = true; disTxt = "passt nicht zum gewählten Fahrweg"; }
      }
    }
    var h = '<button type="button" class="opt alw' + (on ? " on" : "") + (dis ? " dis" : "") + '" ' + (dis ? "disabled " : "") +
      'onclick="toggleAlw(' + i + ",'" + aid + "'," + (isRet ? "true" : "false") + ')">' +
      '<div class="rt-name">' + (on ? "☑ " : "☐ ") + esc(a.n) +
      (a.excl ? " <span class='muted' style='font-size:13px'>(schließt andere ALW aus)</span>" : "") + "</div>" +
      (d.entf.length || d.dazu.length ? '<div class="delta">' + deltaChips(d) + "</div>" : '<div class="muted" style="font-size:12px">ergänzt den Regelweg</div>') +
      (dis && disTxt ? '<div class="muted" style="font-size:12px">' + disTxt + "</div>" : "") +
      (conf ? '<div class="warn">⚠️ Überschneidet sich' + (conf.withId ? " mit „" + esc(ALW[conf.withId].n) + "“" : "") + " – nur eine der beiden wirkt</div>" : "") +
      (nm ? '<div class="warn">⚠️ Dieser ALW verdrängt eine andere Auswahl</div>' : "") +
      "</button>";
    return h;
  }
  function groupToggle(list, open, fn, label) {
    var sel = alwSel.filter(function (a2) { return list.indexOf(a2) >= 0; }).length;
    var txt = (sel ? sel + " ausgewählt – " : "") + list.length + " " + label;
    return '<button type="button" class="opt toggle" onclick="' + fn + '(' + i + "," + (isRet ? "true" : "false") + ')">' +
      (open ? "▴" : "▾") + " " + esc(txt) + "</button>";
  }
  html += '<div class="section-t">Alternative Laufwege (ALW)</div>';
  if (!avail.length) {
    html += '<div class="muted" style="margin:0 16px 8px;font-size:14px">Keine ALW verfügbar</div>';
  } else {
    if (muc.length) {
      html += groupToggle(muc, alwOpen, "toggleAlwOpen", "München-ALW");
      if (alwOpen) muc.forEach(function (aid) { html += alwBtn(aid); });
    }
    if (rest.length) {
      html += groupToggle(rest, alwOpen2, "toggleAlwOpen2", "weitere ALW");
      if (alwOpen2) rest.forEach(function (aid) { html += alwBtn(aid); });
    }
  }
  /* Optionen */
  var oavail = r.opts.filter(function (oid) { return !!OPT[oid]; });
  if (oavail.length) {
    html += '<div class="section-t">Zusätzlich anwählbare Optionen</div>';
    oavail.forEach(function (oid) {
      var o = OPT[oid];
      var on = optSel.indexOf(oid) >= 0;
      var ok2 = optAvailable(oid, leg.chain);
      html += '<button type="button" class="opt alw' + (on && ok2 ? " on" : "") + (ok2 ? "" : " dis") + '" ' +
        (ok2 ? "" : "disabled ") + 'onclick="toggleOpt(' + i + ",'" + oid + "'," + (isRet ? "true" : "false") + ')">' +
        '<div class="rt-name">' + (on && ok2 ? "☑ " : "☐ ") + esc(o.n) + "</div>" +
        (!ok2 ? '<div class="muted" style="font-size:12px">erst verfügbar, wenn der passende Fahrweg/ALW gewählt ist</div>' : "") +
        "</button>";
    });
  }
  /* Ergebnis-Kette */
  html += '<div class="section-t">Deine Fahrt</div><div class="card">' + chainChips(leg.chain);
  leg.warnings.forEach(function (wx) {
    if (!ALW[wx.id]) return;
    html += '<div class="warn">⚠️ „' + esc(ALW[wx.id].n) + "“ überschneidet sich mit einer anderen Auswahl – wirkt hier nicht</div>";
  });
  html += "</div>";
  var next = isRet ? "mehr" : "ret";
  html += '<button class="btn-main" onclick="pushStep({k:\'' + next + "',i:" + i + '})">Weiter</button>';
  return html;
}

/* ---------- Auswertung ---------- */
function collectDriven() {
  var driven = {}; /* secId -> [dates] */
  state.entries.forEach(function (e) {
    (e.fahrten || []).forEach(function (f) {
      (f.chain || []).forEach(function (s) { (driven[s] = driven[s] || []).push(e.date); });
      if (f.retour) (f.retour.chain || []).forEach(function (s) { (driven[s] = driven[s] || []).push(e.date); });
    });
  });
  return driven;
}
function lastOf(dates) {
  return dates && dates.length ? dates.slice().sort().pop() : null;
}
function viewStats() {
  var driven = collectDriven();
  var today = todayISO();
  var html = '<div class="content">';

  var rows = [];
  Object.keys(SECTIONS).forEach(function (sid) {
    var lf = lastOf(driven[sid]) || seedFromFrist(SECTIONS[sid].f);
    if (!lf) return;
    var frist = new Date(lf);
    frist.setFullYear(frist.getFullYear() + 1);
    rows.push({ sid: sid, lf: lf, frist: frist.toISOString().slice(0, 10), a: ampelOf(lf, today) });
  });
  rows.sort(function (a, b) { return a.frist < b.frist ? -1 : 1; });
  html += '<div class="card"><div class="qlabel">⏰ Nächste Fristen (12-Monats-Regel)</div>';
  rows.slice(0, 6).forEach(function (r2) {
    html += '<div class="dist-lbl" style="margin-bottom:5px"><span>' + ampelHTML(r2.a) + " " + esc(SECTIONS[r2.sid].n) + "</span>" +
      '<span class="muted">Frist ' + fmtDate(r2.frist) + "</span></div>";
  });
  html += '<div class="muted" style="font-size:12px;margin-top:6px">Rot = über 12 Monate ohne Fahrt → mit dem Dienstplaner sprechen. Gelb = in ~3 Monaten fällig.</div></div>';
  /* Abschnitte nach Regionalbereich */
  var year = state.jahr;
  var blk = blockInfo();
  var heuteH2 = new Date().getMonth() >= 6;
  var aktH2 = heuteH2 ? "H2" : "H1";
  html += '<div class="card"><div class="qlabel">📅 Halbjahr (wie auf dem Zettel)</div>' +
    '<div class="chips wrap" style="padding:0">' +
    '<button class="chip' + (blk.h2 ? "" : " on") + '" onclick="setBlock(\'H1\')">Jan – Jun</button>' +
    '<button class="chip' + (blk.h2 ? " on" : "") + '" onclick="setBlock(\'H2\')">Jul – Dez</button>' +
    '</div><div class="muted" style="font-size:12px;margin-top:6px">Angezeigt: ' +
    (blk.h2 ? "Jul – Dez " : "Jan – Jun ") + year +
    (aktH2 === (blk.h2 ? "H2" : "H1") ? " (aktuelles Halbjahr)" : "") +
    '. Nach Ablauf abgeben wie beim Zettel. Zahl = Tag deiner letzten Fahrt im Monat, X = keine Fahrt.</div></div>';
  /* Monats-Chips nur für den gewählten Halbjahr-Block */
  /* Monats-Chips (Jürgen 09.11.2026): Statt grün-Anhäkchen zeigt jeder Monat den
     TAG der letzten Fahrt in diesem Monat; ohne Fahrt ein X. */
  function monthsHTML(dates) {
    var out = "";
    for (var m = 0; m < 6; m++) {
      var mo = blk.start + m;

      dates.forEach(function (d) {
        if (+d.slice(0, 4) === year && +d.slice(5, 7) === mo + 1 && d > last) last = d;

    }
    return '<div class="months">' + out + "</div>";
  }

    html += '<div class="section-t">' + ({ S: "Süd", M: "Mitte", N: "Nord", SO: "Südost" })[rb] + "</div>";
    RB[rb].forEach(function (sid) {

      var lf = lastOf(driven[sid]) || seedFromFrist(sec.f);
      var a = lf ? ampelOf(lf, today) : "none";
      html += '<div class="card sec"><div class="dist-lbl" style="margin-bottom:4px">' +
        '<span>' + ampelHTML(a) + " <b>" + esc(sec.n) + "</b> <span class='muted' style='font-size:12px'>" + esc(sec.v) + " → " + esc(sec.b) + "</span></span>" +
        '<span class="muted" style="font-size:12px">' + (lf ? "letzte Fahrt " + fmtDate(lf) : "noch nie gefahren") + "</span></div>" +
        monthsHTML(driven[sid] || []) + "</div>";
    });
  });
  /* Baureihen */
  html += '<div class="section-t">Baureihen</div>';
  var brDriven = {};
  state.entries.forEach(function (e) {
    (e.baureihen || []).forEach(function (b) { (brDriven[b] = brDriven[b] || []).push(e.date); });
  });
  BAUREIHEN.forEach(function (b) {
    var lf = lastOf(brDriven[b]);
    var a = lf ? ampelOf(lf, today) : "none";
    html += '<div class="card sec"><div class="dist-lbl" style="margin-bottom:4px">' +
      '<span>' + ampelHTML(a) + " <b>" + esc(b) + "</b></span>" +
      '<span class="muted" style="font-size:12px">' + (lf ? "letzte Fahrt " + fmtDate(lf) : "noch nicht eingetragen") + "</span></div>" +
      monthsHTML(brDriven[b] || []) + "</div>";
  });
  /* Sicherung */
  html += backupCard();
  html += "</div>";
  return html;
}

/* ---------- Verlauf ---------- */
function viewLog() {
  if (!state.entries.length) {
    return '<div class="center"><div class="big-emoji">🗂️</div><h2 style="margin:0 0 6px;font-size:20px">Noch nichts drin</h2>' +
      '<p class="muted">Deine eingetragenen Fahrten landen hier.</p></div>';
  }
  var html = '<div class="content">';
  state.entries.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (e) {
    html += '<div class="card"><div class="dist-lbl" style="margin-bottom:6px">' +
      '<span style="font-weight:600;color:#0f172a">📆 ' + fmtDate(e.date) + "</span>" +
      '<span class="tag">' + esc(brGruppenText(e.baureihen)) + "</span></div>";
    if (!(e.fahrten || []).length) {
      html += '<div class="muted" style="font-size:12px;margin-top:2px">ohne Fahrt – nur Baureihen eingetragen (z. B. Fahrzeug bereitgestellt)</div>';
    }
    (e.fahrten || []).forEach(function (f, fi) {
      html += '<div class="trip"><div class="rt-name" style="margin-top:' + (fi ? 10 : 4) + 'px">' +
        "🚆 " + esc(HBF[f.start] || f.start) + " → " + esc(HBF[f.ziel] || f.ziel) + "</div>";
      if (f.dreh && f.drehName) {
        html += '<div class="muted" style="font-size:12px;margin-top:2px">🔄 ' + esc(f.drehName) + "</div>";
      }
      if (f.chain && f.chain.length) html += chainChips(f.chain);
      else html += '<div class="warn" style="font-size:12px">ohne Fahrweg gespeichert</div>';
      (f.alwLabels || []).forEach(function (l) {
        html += '<div class="muted" style="font-size:12px;margin-top:3px">↪ ' + esc(l) + "</div>";
      });
      if (f.retour) {
        html += '<div class="rt-name" style="margin-top:8px">↩️ Retour → ' + esc(HBF[f.retour.ziel]) + "</div>";
        if (f.retour.chain) html += chainChips(f.retour.chain);
        (f.retour.alwLabels || []).forEach(function (l) {
          html += '<div class="muted" style="font-size:12px;margin-top:3px">↪ ' + esc(l) + "</div>";
        });
      }
      html += "</div>";
    });
    if (e.note) html += '<div class="note">„' + esc(e.note) + "“</div>";
    if (state.confirmId === e.id) {
      html += '<div class="flexrow"><button type="button" class="btn-sm btn-red" onclick="deleteEntry(\'' + e.id + '\')">Ja, löschen</button>' +
        '<button type="button" class="btn-sm btn-grey" onclick="state.confirmId=null;render()">Abbrechen</button></div>';
    } else {
      html += '<button type="button" class="del" onclick="state.confirmId=\'' + e.id + '\';render()">Eintrag löschen</button>';
    }
    html += "</div>";
  });
  return html + "</div>";
}

/* ---------- Backup ---------- */
function backupCard() {
  return '<div class="card"><div class="qlabel">💾 Sicherung</div>' +
    '<p class="muted" style="margin:0 0 10px;font-size:13px">Deine Einträge liegen nur auf diesem Gerät. Kopiere den Block als Backup – oder füge ein altes Backup ein und tippe auf „Laden“.</p>' +
    '<textarea rows="4" id="backupArea" style="font-size:11px;font-family:ui-monospace,Menlo,monospace" oninput="state.backupText=this.value"></textarea>' +
    '<div class="flexrow"><button type="button" class="btn-sm btn-grey" onclick="copyBackup()">Kopieren</button>' +
    '<button type="button" class="btn-sm btn-red" onclick="restoreBackup()">Laden</button></div>' +
    '<div id="backupMsg" style="text-align:center;font-size:14px;color:#475569;margin-top:8px"></div></div>';
}
function backupMsg(text) {
  var el = document.getElementById("backupMsg");
  if (el) el.textContent = text;
  setTimeout(function () { if (el) el.textContent = ""; }, 2600);
}
function copyBackup() {
  var text = (state.backupText || "").trim() || JSON.stringify(state.entries);
  var done = function () { backupMsg("Kopiert! ✅"); };
  var fail = function () { backupMsg("Bitte Text manuell markieren und kopieren."); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
  else fail();
}
function restoreBackup() {
  var text = (state.backupText || "").trim();
  try {
    var parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) throw new Error("kein Array");
    var byId = {};
    state.entries.concat(parsed).forEach(function (e) { if (e && e.id) byId[e.id] = e; });
    state.entries = Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return (a.date || "") < (b.date || "") ? -1 : 1; });
    persist();
    render();
    backupMsg("Daten geladen! ✅");
  } catch (err) { backupMsg("Das ist kein gültiger Daten-Block. ❌"); }
}

/* ---------- Aktionen / Persistenz ---------- */
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries)); } catch (e) {}
}
/* Eintrag aus dem Verlauf löschen (Jürgen 09.11.2026: „Ja, löschen“-Button tat nichts –
   die aufgerufene Funktion existierte nicht). */
function deleteEntry(id) {
  state.entries = state.entries.filter(function (e) { return e.id !== id; });
  state.confirmId = null;
  persist();
  render();
}
function go(tab) { state.tab = tab; render(); window.scrollTo(0, 0); }

function render() {
  var wrap = document.getElementById("wrap");
  if (state.tab === "form" && !state.w && !state.saved) startWizard();
  /* Auto-Skip: Fahrt endet in München → Retour entfällt */
  if (state.tab === "form" && state.w && state.w.steps.length) {
    var cs = curStep();
    if (cs.k === "ret") {
      var f = fahrtOf(cs.i);
      if (f.ziel === "muenchen_hbf" || f.ziel === "muenchen_ost") {
        f.retour = null;
        state.w.steps.push({ k: "mehr", i: cs.i });
      }
    }
  }
  var body = state.tab === "form" ? viewForm() : state.tab === "stats" ? viewStats() : viewLog();
  if (typeof body === "object" && body.skip) { state.w.steps.push(body.skip); return render(); }
  var tabs = [
    { id: "form", ico: "📝", label: "Eintragen" },
    { id: "stats", ico: "📊", label: "Auswertung" },
    { id: "log", ico: "🗂️", label: "Verlauf" }
  ];
  var tabbar = '<div class="tabbar">' + tabs.map(function (t) {
    return '<button type="button" class="tab' + (state.tab === t.id ? " on" : "") + '" onclick="go(\'' + t.id + '\')">' +
      '<span class="ico">' + t.ico + "</span>" + t.label + "</button>";
  }).join("") + "</div>";
  var stepsH = "";
  if (state.tab === "form" && state.w && !state.saved && state.w.fahrten.length) {
    stepsH = '<div class="crumbs">' + state.w.fahrten.length + ". Fahrt" + "</div>";
  }
  wrap.innerHTML =
    '<header><div class="logo">🚆</div><div><h1>Streckenkunde</h1><div class="sub">Dein digitales Streckenkunde-Heft</div></div></header>' +
    body + tabbar;
  if (state.tab === "stats") {
    var ba = document.getElementById("backupArea");
    if (ba && !state.backupText) ba.value = JSON.stringify(state.entries);
  }
  if (state.tab === "form" && state.w && !state.saved) {
    var na = document.getElementById("noteArea");
    if (na) na.value = state.w.note || "";
    var da = document.getElementById("dateArea");
    if (da) da.value = state.w.date;
  }
}

render();

</script>
</body>
</html>
