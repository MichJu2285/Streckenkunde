  h1 { font-size: 17px; margin: 0; line-height: 1.2; }
  .sub { font-size: 12px; color: #64748b; line-height: 1.2; }
  .content { padding-top: 12px; }
  .crumbs { font-size: 12px; font-weight: 700; color: var(--red); margin: 0 16px 6px; }
  .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.06); margin: 0 16px 10px; }
  .qlabel { font-weight: 600; margin-bottom: 10px; font-size: 16px; }
  .welcome { margin: 0 16px 12px; padding: 14px 16px; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.06); font-size: 17px; font-weight: 600; color: #0f172a; border-left: 4px solid #EC0016; }
  .welcome span { display: block; margin-top: 4px; font-weight: 400; font-size: 14px; color: #64748b; }
  .opt { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; color: #334155; font-size: 16px; margin-bottom: 8px; cursor: pointer; font-family: inherit; }
  .opt:last-child { margin-bottom: 0; }
  .opt.on { background: #fef2f2; border-color: var(--red); color: #b91c1c; font-weight: 600; }
  .opt.back { background: #fff; color: #64748b; font-size: 14px; padding: 8px 14px; }
  .opt.toggle { background: #fff; font-weight: 600; color: #475569; font-size: 14px; }
  .opt.dis { opacity: .5; cursor: default; }
  .opt.route .rt-name, .opt.alw .rt-name { font-weight: 600; margin-bottom: 6px; }
  .btn-main { display: block; width: calc(100% - 32px); margin: 4px 16px 10px; background: var(--red); color: #fff; border: none; border-radius: 16px; padding: 15px; font-size: 17px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-ghost { display: block; width: calc(100% - 32px); margin: 0 16px 10px; background: #fff; color: #334155; border: 1px solid #e2e8f0; border-radius: 16px; padding: 15px; font-size: 17px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-sm { flex: 1; border: none; border-radius: 12px; padding: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-grey { background: #f1f5f9; color: #334155; }
  .btn-red { background: var(--red); color: #fff; }
  textarea { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; font-size: 16px; font-family: inherit; color: #0f172a; }
  textarea:focus { outline: none; border-color: var(--red); }
  .hint { margin: 0 16px 10px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 14px; padding: 10px 12px; font-size: 14px; }
  .center { text-align: center; padding: 48px 20px; }
  .big-emoji { font-size: 54px; margin-bottom: 12px; }
  .muted { color: #64748b; font-size: 15px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; -webkit-overflow-scrolling: touch; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .chips.static { flex-wrap: wrap; overflow: visible; margin: 0; }
  .chip { flex: none; border-radius: 99px; padding: 8px 14px; font-size: 14px; font-weight: 600; border: 1px solid #e2e8f0; background: #fff; color: #475569; font-family: inherit; cursor: pointer; }
  .chip.on { background: var(--red); border-color: var(--red); color: #fff; }
  .chip.small { padding: 3px 10px; font-size: 12px; margin: 2px 4px 2px 0; background: #f1f5f9; border-color: #f1f5f9; color: #475569; cursor: default; }
  .chip.weg { background: #fef2f2; border-color: #fecaca; color: #b91c1c; text-decoration: line-through; }

  .delta { margin-top: 2px; }
  .warn { margin-top: 6px; font-size: 12px; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 6px 10px; }
  .tag { display: inline-block; font-size: 12px; background: #f1f5f9; color: #475569; border-radius: 99px; padding: 4px 10px; margin: 2px 4px 2px 0; }
  .note { font-size: 14px; color: #64748b; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f1f5f9; font-style: italic; }
  .del { background: none; border: none; color: #94a3b8; font-size: 12px; margin-top: 6px; padding: 0; font-family: inherit; cursor: pointer; }

  .card.sec { padding: 10px 14px; margin-bottom: 6px; }
  .trip { margin-top: 4px; }

/* Retour-Spiegelung (Grundregel: alle Wege gelten in beide Richtungen) wird
   zur Laufzeit aus den Hinfahrt-Routen erzeugt (mirrorRoute in engine.js). */
/* ============ Streckenkunde v2 – Engine ============ */
/* Kernidee: Jeder ALW ist ein Muster→Ersetzung-Baustein (sub → rep), der an einer
   bestimmten Stelle der Kette andockt. MEHRERE ALW pro Fahrt sind möglich, solange
   sie verschiedene Stellen der Kette ersetzen (keine Überlappung). Überlappende
   ALW bleiben wählbar, werden aber mit Warnung markiert (Jürgen, 01.11.2026).
   Retour = gleiche Regeln an der gespiegelten Kette (sub/rep rückwärts). */

function findRun(chain, run) {
  if (!run.length) return -1;
  outer: for (var i = 0; i + run.length <= chain.length; i++) {
    for (var j = 0; j < run.length; j++) if (chain[i + j] !== run[j]) continue outer;
    return i;
  }
  return -1;
}

function rev(a) { return a.slice().reverse(); }

function routeById(id) {
  for (var i = 0; i < ROUTES.length; i++) if (ROUTES[i].id === id) return ROUTES[i];
  return null;
}

function routesFor(start, ziel) {
  return ROUTES.filter(function (r) { return r.start === start && r.ziel === ziel; });
}

/* Gespiegelte Route (Retour): X -> München wird aus München -> X erzeugt. */
function mirrorRoute(route, ruckziel, appendLeg) {
  var secs = rev(route.secs);
  if (appendLeg) secs = secs.concat([appendLeg]);
  return {
    id: route.id + "_r" + (appendLeg ? "_x" : ""),
    start: route.ziel, ziel: ruckziel,
    n: route.n, d: false,
    secs: secs,
    alws: route.alws.slice(),
    opts: route.opts.slice(),
    mirrored: true
  };
}

/* Retour-Routen von "von" nach "ruckziel": Spiegelung aller Hinfahrt-Routen
   ruckziel -> von. Für Rückziel München Ost zusätzlich die via-Hbf-Variante
   (gespiegelte Hbf-Route + 50/1-Bein, kein Durchschleifen). */
function retourRoutes(von, ruckziel) {
  var out = [];
  var direct = ROUTES.filter(function (r) { return r.start === ruckziel && r.ziel === von; });
  direct.forEach(function (r) { out.push(mirrorRoute(r, ruckziel)); });
  if (ruckziel === "muenchen_ost") {
    var viaHbf = ROUTES.filter(function (r) { return r.start === "muenchen_hbf" && r.ziel === von; });
    viaHbf.forEach(function (r) {
      var m = mirrorRoute(r, ruckziel, "S50/1");
      m.n = "via Hbf (50/1-Bein)";
      out.push(m);
    });
    /* Standard-Rückroute ab Ost = gespiegelte Ost-Route (via Laim etc.) */
    var ostStd = out.filter(function (r) { return r.id.indexOf("_r") === 0 || r.id.indexOf("o") === 0; });
    ostStd.forEach(function (r) { r.d = false; });
    var firstOst = out.filter(function (r) { return ROUTES.some(function (o) { return o.id + "_r" === r.id && o.start === "muenchen_ost"; }); });
    if (firstOst.length) firstOst[0].d = true;
    else if (out.length) out[out.length - 1].d = true;
  }
  if (out.length && !out.some(function (r) { return r.d; })) out[0].d = true;
  return out;
}

/* ALW-Anwendungsplan: Sucht die Muster aller gewählten ALW in der Basiskette.
   - Nicht überlappende ALW werden alle angewendet (Mehrfach-ALW!).
   - Überlappende ALW: nur der erste (links in der Kette) wirkt, der Rest bekommt
     eine Konflikt-Warnung (bleibt aber wählbar – Jürgens Entscheidung 01.11.2026). */
function planAlws(base, alwIds, mirrored) {
  var rules = alwIds.map(function (id) {
    var a = ALW[id];
    return {
      id: id, n: a.n, v: mirrored ? a.vr : a.v,
      sub: mirrored ? rev(a.sub) : a.sub.slice(),
      rep: mirrored ? rev(a.rep) : a.rep.slice()
    };
  });
  var found = [], noMatch = [];
  rules.forEach(function (r) {
    var idx = findRun(base, r.sub);
    if (idx >= 0) found.push({ r: r, idx: idx });
    else noMatch.push(r.id);
  });
  found.sort(function (a, b) { return a.idx - b.idx; });
  var applied = [], conflicts = [];
  var lastEnd = -1, lastId = null;
  found.forEach(function (m) {
    var end = m.idx + m.r.sub.length;
    if (m.idx < lastEnd) {
      conflicts.push({ id: m.r.id, withId: lastId });
    } else {
      applied.push(m);
      if (end > lastEnd) { lastEnd = end; lastId = m.r.id; }
    }
  });
  return { applied: applied, conflicts: conflicts, noMatch: noMatch };
}

/* Kette aus Plan bauen: Ersetzungen von rechts nach links anwenden. */
function composeChain(base, plan) {
  var chain = base.slice();
  plan.applied.slice().sort(function (a, b) { return b.idx - a.idx; }).forEach(function (m) {
    var args = [m.idx, m.r.sub.length].concat(m.r.rep);
    Array.prototype.splice.apply(chain, args);
  });
  return chain;
}

/* Optionen anwenden (kein kompletter Laufweg – Abschnitte kommen hinzu). */
function optAvailable(optId, chain) {
  var o = OPT[optId];
  if (!o) return false;
  if (o.cond) {
    var parts = o.cond.split(":");
    if (parts[0] === "chainHas" && chain.indexOf(parts[1]) === -1) return false;
  }
  return true;
}
function applyOpts(chain, optIds) {
  var out = chain.slice();
  optIds.forEach(function (id) {
    var o = OPT[id];
    if (!o || !optAvailable(id, out)) return;
    if (o.at === "end") out = out.concat(o.add);
    else if (o.at === "beforeSection") {
      var i = out.indexOf(o.ref);
      if (i >= 0) out = out.slice(0, i).concat(o.add).concat(out.slice(i));
    } else if (o.at === "afterSection") {
      var j = out.indexOf(o.ref);
      if (j >= 0) out = out.slice(0, j + 1).concat(o.add).concat(out.slice(j + 1));
    }
  });
  return out;
}

/* Multiset-Delta: was kommt dazu, was entfällt (für die ALW-Karten-Anzeige). */
function delta(base, result) {
  var rest = {};
  result.forEach(function (s) { rest[s] = (rest[s] || 0) + 1; });
  var entf = [];
  base.forEach(function (s) {
    if ((rest[s] || 0) > 0) rest[s]--;
    else entf.push(s);
  });
  var dazu = [];
  result.forEach(function (s) {
    if ((rest[s] || 0) > 0) { dazu.push(s); rest[s]--; }
  });
  return { entf: entf, dazu: dazu };
}

/* Komplette Fahrweg-Auswertung einer Richtung (Hin- oder Rückfahrt). */
function composeLeg(route, alwIds, optIds) {
  /* Gespiegelte Routen speichern ihre Kette bereits in Fahrtrichtung. */
  var base = route.secs;
  var mir = !!route.mirrored;
  var plan = planAlws(base, alwIds || [], mir);
  var chain = composeChain(base, plan);
  /* Konflikt-Warnung: überlappende ALW zeigen, welche nicht gewirkt haben */
  var chainAfterConflicts = chain.slice();
  var warnings = plan.conflicts.map(function (c) {
    return { typ: "konflikt", id: c.id, withId: c.withId };
  });
  plan.noMatch.forEach(function (id) {
    warnings.push({ typ: "keinTreffer", id: id });
  });
  var finalChain = applyOpts(chain, optIds || []);
  /* Delta pro gewähltem ALW (gegen die Basiskette gerechnet) */
  var deltas = {};
  (alwIds || []).forEach(function (id) {
    var single = planAlws(base, [id], mir);
    var singleChain = composeChain(base, single);
    deltas[id] = delta(base, singleChain);
  });
  return {
    base: base, chain: finalChain, plan: plan,
    warnings: warnings, deltas: deltas,
    appliedIds: plan.applied.map(function (m) { return m.r.id; }),
    alwLabels: (alwIds || []).map(function (id) {
      var a = ALW[id];
      return "Ab " + (mir ? a.vr : a.v) + " " + a.n;
    })
  };
}

/* ---------- Auswertung / Ampel ---------- */
var MONTHS_MS = 1000 * 60 * 60 * 24 * 30.44;

function monthDiff(dFrom, dTo) {
  if (!dFrom) return null;
  var a = new Date(dFrom), b = new Date(dTo);
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}

/* Grün = frisch, Gelb = ab 9 Monaten (innerhalb von 3 Monaten fällig),
   Rot = über 12 Monate ohne Fahrt. */
function ampelOf(lastFahrt, todayStr) {
  var m = monthDiff(lastFahrt, todayStr);
  if (m === null) return "none";
  if (m >= 12) return "rot";
  if (m >= 9) return "gelb";
  return "gruen";
}

/* Startwert aus der Kdg-Frist der Bibliothek: letzte Fahrt = Frist − 12 Monate. */
function seedFromFrist(frist) {
  if (!frist) return null;
  var d = new Date(frist);
  d.setFullYear(d.getFullYear() - 1);
  return d.toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return "—";
  var p = iso.split("-");
  return p[2] + "." + p[1] + "." + p[0];
}

/* ---------- Helfer ---------- */
function loadEntries() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    var parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}
function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function secName(id) { return SECTIONS[id] ? SECTIONS[id].n : id; }
function chainChips(secs) {
  return '<span class="chips static">' + secs.map(function (s) {
    return '<span class="chip small">' + esc(secName(s)) + "</span>";
  }).join("") + "</span>";
}
function deltaChips(d) {
  var h = "";
  if (d.entf.length) h += d.entf.map(function (s) {
    return '<span class="chip small weg">' + esc(secName(s)) + "</span>";
  }).join("");
  if (d.dazu.length) h += d.dazu.map(function (s) {
    return '<span class="chip small dazu">' + esc(secName(s)) + "</span>";
  }).join("");
  return h;
}
function ampelHTML(a) {
  var c = a === "gruen" ? "#10B981" : a === "gelb" ? "#F59E0B" : a === "rot" ? RED : "#94a3b8";
  return '<span class="ampel" style="background:' + c + '"></span>';
}

/* Routen für Start → Ziel, mit Spiegelungs-Fallback (Grundregel: beide Richtungen). */
function routesForWithFallback(start, ziel) {
  var direct = routesFor(start, ziel);
  if (direct.length) return direct;
  var back = routesFor(ziel, start);
  if (back.length) return back.map(function (r) { return mirrorRoute(r, start); });
  return [];
}

/* ---------- Wizard ---------- */
function startWizard() {
  state.w = {
    steps: [{ k: "datum" }],
    baureihen: [],
    nichts: false,
    fahrten: [],
    note: "",
    date: todayISO()
  };
  state.saved = false;
  state.zielGroup = false;
  state.dateCustom = false;
  state.dateEdit = false;
}
function curStep() { return state.w.steps[state.w.steps.length - 1]; }
function pushStep(s) { state.w.steps.push(s); render(); window.scrollTo(0, 0); }
function backStep() {
  if (state.w.steps.length > 1) { state.w.steps.pop(); render(); window.scrollTo(0, 0); }
}
function fahrtOf(i) {
  if (!state.w.fahrten[i]) {
    state.w.fahrten[i] = { start: null, ziel: null, routeId: null, alws: [], opts: [], alwOpen: false, retour: null };
  }
  return state.w.fahrten[i];
}
function letztesZiel() {
  /* Ziel der letzten Fahrt (heute oder im letzten Eintrag) – für die Fahrtenkette */
  if (state.w && state.w.fahrten.length) {
    var f = state.w.fahrten[state.w.fahrten.length - 1];
    if (f && f.ziel) return f.ziel;
  }
  if (state.entries.length) {
    var e = state.entries[state.entries.length - 1];
    if (e && e.fahrten && e.fahrten.length) return e.fahrten[e.fahrten.length - 1].ziel;
  }
  return null;
}

function toggleBaureihe(br) {
  var i = state.w.baureihen.indexOf(br);
  if (i >= 0) state.w.baureihen.splice(i, 1);
  else state.w.baureihen.push(br);
  render();
}
function nichtsZuEintragen() {
  state.w.nichts = true;
  render();
}
function pickStart(i, h) {
  var f = fahrtOf(i);
  f.start = h;

}
function pickZiel(i, h) {
  var f = fahrtOf(i);
  f.ziel = h;
  f.routeId = null; f.alws = []; f.opts = []; f.alwOpen = false;
  pushStep({ k: "weg", i: i });
}
function setRoute(i, rid) {
  var f = fahrtOf(i);
  f.routeId = rid;
  f.alws = []; f.opts = [];
  render();
}
function toggleAlw(i, aid, isRet) {
  var f = fahrtOf(i);
  var sel = isRet && f.retour ? f.retour.alws : f.alws;
  var p = sel.indexOf(aid);
  if (p >= 0) sel.splice(p, 1); else sel.push(aid);
  render();
}
function toggleOpt(i, oid, isRet) {
  var f = fahrtOf(i);
  var sel = isRet && f.retour ? f.retour.opts : f.opts;
  var p = sel.indexOf(oid);
  if (p >= 0) sel.splice(p, 1); else sel.push(oid);

}
function toggleAlwOpen(i, isRet) {
  var f = fahrtOf(i);
  if (isRet && f.retour) f.retour.alwOpen = !f.retour.alwOpen;
  else f.alwOpen = !f.alwOpen;
  render();
}
function startRetour(i) {
  var f = fahrtOf(i);
  f.retour = { ziel: null, routeId: null, alws: [], opts: [], alwOpen: false };

}
function keineRetour(i) {

}
function pickRuckziel(i, h) {

  f.retour.ziel = h;
  f.retour.routeId = null; f.retour.alws = []; f.retour.opts = [];
  pushStep({ k: "rweg", i: i });
}
function setRetourRoute(i, rid) {
  var f = fahrtOf(i);
  f.retour.routeId = rid;
  f.retour.alws = []; f.retour.opts = [];
  render();
}
function weitereFahrt(i) {

}
function keineWeitere(i) { pushStep({ k: "note" }); }
function setNote(v) { state.w.note = v; }
function setDate(v) { state.w.date = v; }
function pickHeute() {

function pickDatum(v) {

function submitEntry() {
  var w = state.w;
  if (!w.baureihen.length || !w.fahrten.length) return;
  var fahrten = w.fahrten.map(function (f) {
    var out = { start: f.start, ziel: f.ziel, routeId: f.routeId, alws: f.alws.slice(), opts: f.opts.slice(), chain: [] };
    var rs = routesForWithFallback(f.start, f.ziel);
    var r = rs.filter(function (x) { return x.id === f.routeId; })[0] || rs.filter(function (x) { return x.d; })[0] || rs[0];
    if (r) {
      var leg = composeLeg(r, f.alws, f.opts);
      out.routeId = r.id;
      out.chain = leg.chain;
      out.alwLabels = leg.alwLabels;
      out.warnings = leg.warnings;
    }
    if (f.retour && f.retour.ziel) {
      var rrs = retourRoutes(f.ziel, f.retour.ziel);
      var rr = rrs.filter(function (x) { return x.id === f.retour.routeId; })[0] || rrs.filter(function (x) { return x.d; })[0] || rrs[0];
      if (rr) {
        var rleg = composeLeg(rr, f.retour.alws, f.retour.opts);
        out.retour = { ziel: f.retour.ziel, routeId: rr.id, alws: f.retour.alws.slice(), opts: f.retour.opts.slice(), chain: rleg.chain, alwLabels: rleg.alwLabels, warnings: rleg.warnings };
      }
    }
    return out;
  });
  state.entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    date: w.date || todayISO(),
    baureihen: w.baureihen.slice(),
    fahrten: fahrten,
    note: (w.note || "").trim()
  });
  persist();
  state.saved = true;
  render();
  window.scrollTo(0, 0);
}

/* ---------- Fahrweg-Schritt (Hin- und Rückfahrt) ---------- */
function wegStepHTML(f, i, isRet) {
  var rs, r, sel, alws, opts, alwSel, optSel, alwOpen;
  if (isRet) {
    rs = retourRoutes(f.ziel, f.retour.ziel);
    r = rs.filter(function (x) { return x.id === f.retour.routeId; })[0] || rs.filter(function (x) { return x.d; })[0] || rs[0];
    sel = f.retour; alwSel = f.retour.alws; optSel = f.retour.opts; alwOpen = f.retour.alwOpen;
  } else {
    rs = routesForWithFallback(f.start, f.ziel);
    r = rs.filter(function (x) { return x.id === f.routeId; })[0] || rs.filter(function (x) { return x.d; })[0] || rs[0];
    sel = f; alwSel = f.alws; optSel = f.opts; alwOpen = f.alwOpen;
  }
  var html = "";
  if (!rs.length) {
    return '<div class="hint">⚠️ Für <b>' + esc(HBF[f.start] || f.start) + " → " + esc(HBF[f.ziel] || f.ziel) +
      '</b> ist noch kein Fahrweg in der Bibliothek. Speichere die Fahrt trotzdem – und sag mir danach den Fahrweg, dann lege ich ihn an.</div>' +
      '<button class="btn-main" onclick="pushStep({k:\'' + (isRet ? "mehr" : "ret") + "',i:" + i + '})">Weiter ohne Fahrweg</button>';
  }
  /* Regelweg(e) / Routen-Auswahl */
  html += '<div class="section-t">' + (rs.length > 1 ? "Welcher Regelweg?" : "Regelweg") + "</div>";
  rs.forEach(function (rt) {
    var on = r && rt.id === r.id;
    html += '<button type="button" class="opt route' + (on ? " on" : "") + '" onclick="' +
      (isRet ? "setRetourRoute(" : "setRoute(") + i + ",'" + rt.id + '\')">' +
      '<div class="rt-name">' + (on ? "✓ " : "") + esc(rt.n) + "</div>" + chainChips(rt.secs) + "</button>";
  });
  if (!r) return html;
  var leg = composeLeg(r, alwSel, optSel);
  /* ALW – einklappbar, MEHRFACHAUSWAHL */
  var avail = r.alws.filter(function (aid) { return !!ALW[aid]; });
  html += '<div class="section-t">Alternative Laufwege (ALW)</div>';
  if (!avail.length) {
    html += '<div class="muted" style="margin:0 16px 8px;font-size:14px">Keine ALW verfügbar</div>';
  } else {
    var toggleTxt = (alwSel.length ? alwSel.length + " ausgewählt – " : "") + avail.length + " ALW verfügbar";
    html += '<button type="button" class="opt toggle" onclick="toggleAlwOpen(' + i + "," + (isRet ? "true" : "false") + ')">' +
      (alwOpen ? "▴" : "▾") + " " + esc(toggleTxt) + "</button>";
    if (alwOpen) {
      avail.forEach(function (aid) {
        var a = ALW[aid];
        var ab = isRet ? a.vr : a.v;
        var on = alwSel.indexOf(aid) >= 0;
        var conf = leg.warnings.filter(function (wx) { return wx.id === aid; })[0];
        var nm = leg.warnings.filter(function (wx) { return wx.withId === aid; })[0];
        var d = leg.deltas[aid] || { entf: [], dazu: [] };
        html += '<button type="button" class="opt alw' + (on ? " on" : "") + '" onclick="toggleAlw(' + i + ",'" + aid + "'," + (isRet ? "true" : "false") + ')">' +
          '<div class="rt-name">' + (on ? "☑ " : "☐ ") + "Ab " + esc(ab) + " " + esc(a.n) + "</div>" +
          (d.entf.length || d.dazu.length ? '<div class="delta">' + deltaChips(d) + "</div>" : '<div class="muted" style="font-size:12px">ergänzt den Regelweg</div>') +
          (conf ? '<div class="warn">⚠️ Überschneidet sich' + (conf.withId ? " mit „Ab " + esc(isRet ? ALW[conf.withId].vr : ALW[conf.withId].v) + " " + esc(ALW[conf.withId].n) + "“" : "") + " – nur eine der beiden wirkt</div>" : "") +
          (nm ? '<div class="warn">⚠️ Eine andere Auswahl verdrängt diesen ALW</div>' : "") +
          "</button>";
      });
    }
  }
  /* Optionen */
  var oavail = r.opts.filter(function (oid) { return !!OPT[oid]; });
  if (oavail.length) {
    html += '<div class="section-t">Zusätzlich anwählbare Optionen</div>';
    oavail.forEach(function (oid) {
      var o = OPT[oid];
      var on = optSel.indexOf(oid) >= 0;
      var ok2 = optAvailable(oid, leg.chain);
      html += '<button type="button" class="opt alw' + (on && ok2 ? " on" : "") + (ok2 ? "" : " dis") + '" ' +
        (ok2 ? "" : "disabled ") + 'onclick="toggleOpt(' + i + ",'" + oid + "'," + (isRet ? "true" : "false") + ')">' +
        '<div class="rt-name">' + (on && ok2 ? "☑ " : "☐ ") + esc(o.n) + "</div>" +
        (!ok2 ? '<div class="muted" style="font-size:12px">erst verfügbar, wenn der passende Fahrweg/ALW gewählt ist</div>' : "") +
        "</button>";
    });
  }
  /* Ergebnis-Kette */
  html += '<div class="section-t">Deine Fahrt</div><div class="card">' + chainChips(leg.chain);
  leg.warnings.forEach(function (wx) {
    if (!ALW[wx.id]) return;
    html += '<div class="warn">⚠️ „Ab ' + esc(isRet ? ALW[wx.id].vr : ALW[wx.id].v) + " " + esc(ALW[wx.id].n) + "“ überschneidet sich mit einer anderen Auswahl – wirkt hier nicht</div>";
  });
  html += "</div>";
  var next = isRet ? "mehr" : "ret";
  html += '<button class="btn-main" onclick="pushStep({k:\'' + next + "',i:" + i + '})">Weiter</button>';
  return html;
}

    if (auto) html += '<div class="muted" style="font-size:13px;margin-bottom:8px">📍 Start automatisch übernommen: <b>' + esc(HBF[f0.start]) + "</b></div>";
    var lz = letztesZiel();
    if (lz && !auto) html += '<button type="button" class="opt" onclick="pickStart(' + s.i + ',\'' + lz + '\')">📍 ' + esc(HBF[lz]) + " <span class='muted'>(letztes Ziel)</span></button>";
    ["muenchen_hbf", "muenchen_ost"].forEach(function (h) {
      html += '<button type="button" class="opt" onclick="pickStart(' + s.i + ',\'' + h + '\')">' + esc(HBF[h]) + "</button>";
    });
    html += '<button type="button" class="opt" onclick="state.anderer=!state.anderer;render()">🚉 Anderer Hbf…</button>';
    if (state.anderer) {
      html += '<div class="chips wrap" style="margin-top:8px">' + Object.keys(HBF).map(function (h) {
        return '<button type="button" class="chip" onclick="pickStart(' + s.i + ',\'' + h + '\')">' + esc(HBF[h]) + "</button>";
      }).join("") + "</div>";
    }
    html += "</div>";
    if (auto) {
      html += '<button class="btn-main" onclick="pushStep({k:\'ziel\',i:' + s.i + '})">Weiter mit ' + esc(HBF[f0.start]) + "</button>";
    }
  } else if (s.k === "ziel") {
    var fg = fahrtOf(s.i);
    html += '<div class="card"><div class="qlabel">🎯 Fahrt ' + (s.i + 1) + " – Wohin ging es?</div>" +
      '<div class="muted" style="font-size:13px;margin-bottom:8px">Von: <b>' + esc(HBF[fg.start]) + "</b></div>";
    var targets = ["stuttgart", "nuernberg", "wuerzburg", "hannover", "kassel", "fulda", "erfurt", "leipzig", "augsburg", "mannheim", "laim_rbf", "pasing_bbf"];
    html += '<div class="chips wrap">' + targets.map(function (t) {
      return '<button type="button" class="chip" onclick="pickZiel(' + s.i + ',\'' + t + '\')">' + esc(HBF[t]) + "</button>";
    }).join("");
    html += '<button type="button" class="chip' + (state.zielGroup ? " on" : "") + '" onclick="state.zielGroup=!state.zielGroup;render()">Frankfurt ▸</button>';
    if (fg.start !== "muenchen_hbf") html += '<button type="button" class="chip" onclick="pickZiel(' + s.i + ',\'muenchen_hbf\')">München Hbf</button>';
    if (fg.start !== "muenchen_ost") html += '<button type="button" class="chip" onclick="pickZiel(' + s.i + ',\'muenchen_ost\')">München Ost</button>';
    html += "</div>";
    if (state.zielGroup) {
      html += '<div class="chips wrap" style="margin-top:8px">' + ["ff_hbf", "ff_ffs", "ff_flh"].map(function (t) {
        return '<button type="button" class="chip" onclick="pickZiel(' + s.i + ',\'' + t + '\')">' + esc(HBF[t]) + "</button>";
      }).join("") + "</div>";
    }
    html += "</div>";
  } else if (s.k === "weg") {
    var f1 = fahrtOf(s.i);
    html += '<div class="card"><div class="qlabel">🛤️ Fahrt ' + (s.i + 1) + ": " + esc(HBF[f1.start]) + " → " + esc(HBF[f1.ziel]) + "</div>";
    html += '<div class="muted" style="font-size:13px">Regelweg ist vorausgewählt. ALW kannst du jetzt <b>mehrfach</b> antippen – einer pro Störung.</div></div>';
    html += wegStepHTML(f1, s.i, false);
  } else if (s.k === "ret") {
    var f2 = fahrtOf(s.i);
    if (f2.ziel === "muenchen_hbf" || f2.ziel === "muenchen_ost") {
      /* endet in München → Retour entfällt */
      f2.retour = null;
      return { html: html, skip: { k: "mehr", i: s.i } };
    }
    html += '<div class="card"><div class="qlabel">↩️ Und retour?</div>' +
      '<div class="muted" style="font-size:13px;margin-bottom:8px">Die Rückfahrt bekommt ihren eigenen Fahrweg – eine Umleitung kann auch nur retour gelten.</div>' +
      '<button type="button" class="opt" onclick="startRetour(' + s.i + ')">Ja, retour nach München</button>' +
      '<button type="button" class="opt" onclick="keineRetour(' + s.i + ')">Nein, ohne Retour</button></div>';
  } else if (s.k === "rziel") {
    var f3 = fahrtOf(s.i);
    html += '<div class="card"><div class="qlabel">🏠 Rückziel?</div>';
    ["muenchen_hbf", "muenchen_ost"].forEach(function (h) {
      html += '<button type="button" class="opt" onclick="pickRuckziel(' + s.i + ',\'' + h + '\')">' + esc(HBF[h]) + "</button>";
    });
    if (f3.start !== "muenchen_hbf" && f3.start !== "muenchen_ost") {
      html += '<button type="button" class="opt" onclick="pickRuckziel(' + s.i + ',\'' + f3.start + '\')">Zurück nach ' + esc(HBF[f3.start]) + "</button>";
    }
    html += "</div>";
  } else if (s.k === "rweg") {
    var f4 = fahrtOf(s.i);
    html += '<div class="card"><div class="qlabel">🛤️ Retour: ' + esc(HBF[f4.ziel]) + " → " + esc(HBF[f4.retour.ziel]) + "</div>";
    html += '<div class="muted" style="font-size:13px">ALW gelten automatisch retour gespiegelt – die Abweichungsbahnhöfe passen sich an.</div></div>';
    html += wegStepHTML(f4, s.i, true);
  } else if (s.k === "mehr") {
    html += '<div class="card"><div class="qlabel">🔁 Gab es heute noch eine weitere Fahrt?</div>' +
      '<div class="muted" style="font-size:13px;margin-bottom:8px">Der Startbahnhof der nächsten Fahrt wird automatisch übernommen.</div>' +
      '<button type="button" class="opt" onclick="weitereFahrt(' + s.i + ')">Ja, weitere Fahrt</button>' +
      '<button type="button" class="opt" onclick="keineWeitere(' + s.i + ')">Nein, das war alles</button></div>';
  } else if (s.k === "note") {
    var cnt = state.w.fahrten.length;
    html += '<div class="card"><div class="qlabel">📝 Notiz (optional)</div>' +
      '<textarea rows="3" id="noteArea" placeholder="Z. B. Verspätung, besonderes Erlebnis …" oninput="setNote(this.value)"></textarea></div>';
    html += '<div class="muted" style="font-size:13px;margin:0 2px 14px">📅 Eintrag für <b>' + fmtDate(state.w.date) + '</b> – <button type="button" class="chip small" onclick="toggleDatumEdit()">ändern</button>';
    if (state.dateEdit) {
      html += '<input type="date" id="dateArea" value="' + state.w.date + '" onchange="setDateLive(this.value)" style="width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;font-size:16px;background:#f8fafc;color:#0f172a;margin-top:8px">';
    }
    html += "</div>";
    html += '<button class="btn-main" onclick="submitEntry()">Speichern 💾</button>';
  }
  html += "</div>";
  return html;
}

/* ---------- Auswertung ---------- */
function collectDriven() {
  var driven = {}; /* secId -> [dates] */
  state.entries.forEach(function (e) {
    (e.fahrten || []).forEach(function (f) {
      (f.chain || []).forEach(function (s) { (driven[s] = driven[s] || []).push(e.date); });
      if (f.retour) (f.retour.chain || []).forEach(function (s) { (driven[s] = driven[s] || []).push(e.date); });
    });
  });
  return driven;
}
function lastOf(dates) {
  return dates && dates.length ? dates.slice().sort().pop() : null;
}
function viewStats() {
  var driven = collectDriven();
  var today = todayISO();
  var html = '<div class="content">';
  /* Fristen-Alarm */
  var rows = [];
  Object.keys(SECTIONS).forEach(function (sid) {
    var lf = lastOf(driven[sid]) || seedFromFrist(SECTIONS[sid].f);
    if (!lf) return;
    var frist = new Date(lf);
    frist.setFullYear(frist.getFullYear() + 1);
    rows.push({ sid: sid, lf: lf, frist: frist.toISOString().slice(0, 10), a: ampelOf(lf, today) });
  });
  rows.sort(function (a, b) { return a.frist < b.frist ? -1 : 1; });
  html += '<div class="card"><div class="qlabel">⏰ Nächste Fristen (12-Monats-Regel)</div>';
  rows.slice(0, 6).forEach(function (r2) {
    html += '<div class="dist-lbl" style="margin-bottom:5px"><span>' + ampelHTML(r2.a) + " " + esc(SECTIONS[r2.sid].n) + "</span>" +
      '<span class="muted">Frist ' + fmtDate(r2.frist) + "</span></div>";
  });
  html += '<div class="muted" style="font-size:12px;margin-top:6px">Rot = über 12 Monate ohne Fahrt → mit dem Dienstplaner sprechen. Gelb = in ~3 Monaten fällig.</div></div>';
  /* Abschnitte nach Regionalbereich */
  var year = state.jahr;
  ["S", "M", "N", "SO"].forEach(function (rb) {
    html += '<div class="section-t">' + ({ S: "Süd", M: "Mitte", N: "Nord", SO: "Südost" })[rb] + "</div>";
    RB[rb].forEach(function (sid) {
      var sec = SECTIONS[sid];
      var lf = lastOf(driven[sid]) || seedFromFrist(sec.f);
      var a = lf ? ampelOf(lf, today) : "none";
      var months = "";
      for (var m = 0; m < 12; m++) {
        var hit = (driven[sid] || []).some(function (d) {
          return +d.slice(0, 4) === year && +d.slice(5, 7) === m + 1;
        });
        months += '<span class="mo' + (hit ? " hit" : "") + '">' + ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"][m] + "</span>";
      }
      html += '<div class="card sec"><div class="dist-lbl" style="margin-bottom:4px">' +
        '<span>' + ampelHTML(a) + " <b>" + esc(sec.n) + "</b> <span class='muted' style='font-size:12px'>" + esc(sec.v) + " → " + esc(sec.b) + "</span></span>" +
        '<span class="muted" style="font-size:12px">' + (lf ? "letzte Fahrt " + fmtDate(lf) : "noch nie gefahren") + "</span></div>" +
        '<div class="months">' + months + "</div></div>";
    });
  });
  /* Baureihen */
  html += '<div class="section-t">Baureihen</div>';
  var brDriven = {};
  state.entries.forEach(function (e) {
    (e.baureihen || []).forEach(function (b) { (brDriven[b] = brDriven[b] || []).push(e.date); });
  });
  BAUREIHEN.forEach(function (b) {
    var lf = lastOf(brDriven[b]);
    var a = lf ? ampelOf(lf, today) : "none";
    var months = "";
    for (var m = 0; m < 12; m++) {
      var hit = (brDriven[b] || []).some(function (d) {
        return +d.slice(0, 4) === year && +d.slice(5, 7) === m + 1;
      });
      months += '<span class="mo' + (hit ? " hit" : "") + '">' + ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"][m] + "</span>";
    }
    html += '<div class="card sec"><div class="dist-lbl" style="margin-bottom:4px">' +
      '<span>' + ampelHTML(a) + " <b>" + esc(b) + "</b></span>" +
      '<span class="muted" style="font-size:12px">' + (lf ? "letzte Fahrt " + fmtDate(lf) : "noch nicht eingetragen") + "</span></div>" +
      '<div class="months">' + months + "</div></div>";
  });
  /* Sicherung */
  html += backupCard();
  html += "</div>";
  return html;
}

/* ---------- Verlauf ---------- */
function viewLog() {
  if (!state.entries.length) {
    return '<div class="center"><div class="big-emoji">🗂️</div><h2 style="margin:0 0 6px;font-size:20px">Noch nichts drin</h2>' +
      '<p class="muted">Deine eingetragenen Fahrten landen hier.</p></div>';
  }
  var html = '<div class="content">';
  state.entries.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (e) {
    html += '<div class="card"><div class="dist-lbl" style="margin-bottom:6px">' +
      '<span style="font-weight:600;color:#0f172a">📆 ' + fmtDate(e.date) + "</span>" +
      '<span class="tag">' + (e.baureihen || []).join(" · ") + "</span></div>";
    (e.fahrten || []).forEach(function (f, fi) {
      html += '<div class="trip"><div class="rt-name" style="margin-top:' + (fi ? 10 : 4) + 'px">' +
        "🚆 " + esc(HBF[f.start] || f.start) + " → " + esc(HBF[f.ziel] || f.ziel) + "</div>";
      if (f.chain && f.chain.length) html += chainChips(f.chain);
      else html += '<div class="warn" style="font-size:12px">ohne Fahrweg gespeichert</div>';
      (f.alwLabels || []).forEach(function (l) {
        html += '<div class="muted" style="font-size:12px;margin-top:3px">↪ ' + esc(l) + "</div>";
      });
      if (f.retour) {
        html += '<div class="rt-name" style="margin-top:8px">↩️ Retour → ' + esc(HBF[f.retour.ziel]) + "</div>";
        if (f.retour.chain) html += chainChips(f.retour.chain);
        (f.retour.alwLabels || []).forEach(function (l) {
          html += '<div class="muted" style="font-size:12px;margin-top:3px">↪ ' + esc(l) + "</div>";
        });
      }
      html += "</div>";
    });
    if (e.note) html += '<div class="note">„' + esc(e.note) + "“</div>";
    if (state.confirmId === e.id) {
      html += '<div class="flexrow"><button type="button" class="btn-sm btn-red" onclick="deleteEntry(\'' + e.id + '\')">Ja, löschen</button>' +
        '<button type="button" class="btn-sm btn-grey" onclick="state.confirmId=null;render()">Abbrechen</button></div>';
    } else {
      html += '<button type="button" class="del" onclick="state.confirmId=\'' + e.id + '\';render()">Eintrag löschen</button>';
    }
    html += "</div>";
  });
  return html + "</div>";
}

/* ---------- Backup ---------- */
function backupCard() {
  return '<div class="card"><div class="qlabel">💾 Sicherung</div>' +
    '<p class="muted" style="margin:0 0 10px;font-size:13px">Deine Einträge liegen nur auf diesem Gerät. Kopiere den Block als Backup – oder füge ein altes Backup ein und tippe auf „Laden“.</p>' +
    '<textarea rows="4" id="backupArea" style="font-size:11px;font-family:ui-monospace,Menlo,monospace" oninput="state.backupText=this.value"></textarea>' +
    '<div class="flexrow"><button type="button" class="btn-sm btn-grey" onclick="copyBackup()">Kopieren</button>' +
    '<button type="button" class="btn-sm btn-red" onclick="restoreBackup()">Laden</button></div>' +
    '<div id="backupMsg" style="text-align:center;font-size:14px;color:#475569;margin-top:8px"></div></div>';
}
function backupMsg(text) {
  var el = document.getElementById("backupMsg");
  if (el) el.textContent = text;
  setTimeout(function () { if (el) el.textContent = ""; }, 2600);
}
function copyBackup() {
  var text = (state.backupText || "").trim() || JSON.stringify(state.entries);
  var done = function () { backupMsg("Kopiert! ✅"); };
  var fail = function () { backupMsg("Bitte Text manuell markieren und kopieren."); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
  else fail();
}
function restoreBackup() {
  var text = (state.backupText || "").trim();
  try {
    var parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) throw new Error("kein Array");
    var byId = {};
    state.entries.concat(parsed).forEach(function (e) { if (e && e.id) byId[e.id] = e; });
    state.entries = Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return (a.date || "") < (b.date || "") ? -1 : 1; });
    persist();
    render();
    backupMsg("Daten geladen! ✅");
  } catch (err) { backupMsg("Das ist kein gültiger Daten-Block. ❌"); }
}

/* ---------- Aktionen / Persistenz ---------- */
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries)); } catch (e) {}
}
function go(tab) { state.tab = tab; render(); window.scrollTo(0, 0); }

function render() {
  var wrap = document.getElementById("wrap");
  if (state.tab === "form" && !state.w && !state.saved) startWizard();
  /* Auto-Skip: Fahrt endet in München → Retour entfällt */
  if (state.tab === "form" && state.w && state.w.steps.length) {
    var cs = curStep();
    if (cs.k === "ret") {
      var f = fahrtOf(cs.i);
      if (f.ziel === "muenchen_hbf" || f.ziel === "muenchen_ost") {
        f.retour = null;
        state.w.steps.push({ k: "mehr", i: cs.i });
      }
    }
  }
  var body = state.tab === "form" ? viewForm() : state.tab === "stats" ? viewStats() : viewLog();
  if (typeof body === "object" && body.skip) { state.w.steps.push(body.skip); return render(); }
  var tabs = [
    { id: "form", ico: "📝", label: "Eintragen" },
    { id: "stats", ico: "📊", label: "Auswertung" },
    { id: "log", ico: "🗂️", label: "Verlauf" }
  ];
  var tabbar = '<div class="tabbar">' + tabs.map(function (t) {
    return '<button type="button" class="tab' + (state.tab === t.id ? " on" : "") + '" onclick="go(\'' + t.id + '\')">' +
      '<span class="ico">' + t.ico + "</span>" + t.label + "</button>";
  }).join("") + "</div>";
  var stepsH = "";
  if (state.tab === "form" && state.w && !state.saved && state.w.fahrten.length) {
    stepsH = '<div class="crumbs">' + state.w.fahrten.length + ". Fahrt" + "</div>";
  }
  wrap.innerHTML =
    '<header><div class="logo">🚆</div><div><h1>Streckenkunde</h1><div class="sub">Dein digitales Streckenkunde-Heft</div></div></header>' +
    body + tabbar;
  if (state.tab === "stats") {
    var ba = document.getElementById("backupArea");
    if (ba && !state.backupText) ba.value = JSON.stringify(state.entries);
  }
  if (state.tab === "form" && state.w && !state.saved) {
    var na = document.getElementById("noteArea");
    if (na) na.value = state.w.note || "";
    var da = document.getElementById("dateArea");
    if (da) da.value = state.w.date;
  }
}

render();

</script>
</body>
