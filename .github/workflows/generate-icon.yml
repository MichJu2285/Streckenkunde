name: Icon bauen

on:
  push:
    paths:
      - "icon-spec.txt"

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icon generieren
        run: python3 generate_icon.py
      - name: Icon einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.png
          git diff --cached --quiet && echo "Icon unveraendert" && exit 0
          git commit -m "App-Icon automatisch generiert"
          git push